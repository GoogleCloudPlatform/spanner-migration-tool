name: sync-dependabot-alerts

on:
  schedule:
    - cron: "0 9 * * *"  # Daily at 09:00 UTC.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-dependabot-alerts
  cancel-in-progress: false

jobs:
  sync_alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Sync Critical and High Dependabot alerts to GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDABOT_ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        run: python3 .github/scripts/sync_dependabot_alerts.py
